name: Verificar CAIE Tienda
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 tests/retain-pages-assets.test.py
      - run: npm run build
        env:
          VITE_PUBLIC_ACCESS: "true"
          VITE_SUPABASE_URL: https://krjyplolmaoflcknhlpt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kcG3Birh6buxfoIqEfC-mA_vaXMOU0f
      - run: npm test
      - name: Preparar PostgreSQL real
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          PG_BIN="$(pg_config --bindir)"
          for executable in postgres initdb pg_ctl; do
            test -x "$PG_BIN/$executable"
            "$PG_BIN/$executable" --version
          done
          echo "CAIE_PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
      - name: Pruebas PostgreSQL real con datos sintéticos
        id: db-tests
        run: npm run test:db
      - name: Diagnóstico PostgreSQL
        if: failure() && steps.db-tests.outcome == 'failure'
        run: |
          if [ -f .local/postgres-test.log ]; then
            tail -n 200 .local/postgres-test.log
          else
            echo "No se generó postgres-test.log; revisar errores de initdb y rutas de ejecutables en el paso anterior."
          fi
      - name: Guardar diagnóstico PostgreSQL
        uses: actions/upload-artifact@v4
        if: failure() && steps.db-tests.outcome == 'failure'
        with:
          name: postgres-failures-synthetic
          path: |
            .local/postgres-test.log
            docs/db-test-results.json
          include-hidden-files: true
          if-no-files-found: warn
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_PUBLIC_ACCESS: "true"
          VITE_SUPABASE_URL: https://krjyplolmaoflcknhlpt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kcG3Birh6buxfoIqEfC-mA_vaXMOU0f
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures-synthetic
          path: playwright-report/
